[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-v2"
version = "0.1.0"
description = "Barcode scanning proof of concept using zxing-cpp."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gaddy" }]
dependencies = [
    "zxing-cpp>=2.2.0",
    "Pillow>=10.0.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
echo-scan = "echo_v2.__main__:main"
echo-eval = "echo_v2.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echo_v2 = ["py.typed", "evaluation/datasets/*.json"]
