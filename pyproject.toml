[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-v2"
version = "0.1.0"
description = "Reliable runtime foundation for Echo v2."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gaddy" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/echo_v2"]

[tool.coverage.report]
fail_under = 95
show_missing = true
omit = ["src/echo_v2/integrations/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echo_v2 = ["py.typed"]
