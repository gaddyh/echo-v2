[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-v2"
version = "0.1.0"
description = "Reliable runtime foundation for Echo v2."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gaddy" }]
dependencies = []

[project.optional-dependencies]
green = ["httpx>=0.27", "websockets>=12"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.30"]
db = [
    "SQLAlchemy>=2.0.30",
    "greenlet>=3.0.0",
    "psycopg[binary]>=3.1.20",
    "alembic>=1.13.3",
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.8",
    "phonenumbers>=8.13.55",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "httpx>=0.27",
    "websockets>=12",
    "fastapi>=0.110",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.1.20",
    "alembic>=1.13.3",
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.8",
    "phonenumbers>=8.13.55",
    "testcontainers[postgres]>=4.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/echo_v2"]
omit = [
    "src/echo_v2/persistence/alembic/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echo_v2 = ["py.typed"]
