# Alembic configuration for Echo v2.
# Run from the project root: `alembic upgrade head`
# The actual migration scripts and env.py live in src/echo_v2/persistence/alembic/.

[alembic]
script_location = src/echo_v2/persistence/alembic
prepend_sys_path = src

# database URL. Overridden by env.py from DATABASE_URL at runtime.
sqlalchemy.url = postgresql+psycopg://echo:echo@localhost:5432/echo

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
